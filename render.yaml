services:
  - type: web
    name: activos-fijos-colegio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@colegio.cl
      - key: ADMIN_PASS
        value: admin123
