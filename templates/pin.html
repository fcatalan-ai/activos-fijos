<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Acceso — Activo {{ id }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#1F3864;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:36px 28px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.logo{font-size:48px;margin-bottom:12px}
h1{font-size:18px;color:#1F3864;font-weight:700;margin-bottom:6px}
.sub{font-size:13px;color:#888;margin-bottom:28px}
.activo-id{display:inline-block;background:#E6F1FB;color:#1F3864;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:24px}
.pin-label{font-size:13px;color:#555;margin-bottom:10px;text-align:left}
.pin-input{width:100%;padding:14px;font-size:24px;text-align:center;letter-spacing:8px;border:2px solid #e0e4e9;border-radius:10px;outline:none;font-weight:700;color:#1F3864}
.pin-input:focus{border-color:#2E74B5}
.pin-btn{width:100%;padding:14px;background:#1F3864;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;transition:background 0.2s}
.pin-btn:hover{background:#2E74B5}
.error{color:#C00;font-size:13px;margin-top:12px;background:#FCEBEB;padding:8px 12px;border-radius:8px}
.hint{font-size:11px;color:#bbb;margin-top:20px}
/* Teclado numerico */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.num-btn{padding:16px;font-size:20px;font-weight:700;background:#f0f4f8;border:1px solid #e0e4e9;border-radius:10px;cursor:pointer;color:#1F3864;transition:background 0.15s}
.num-btn:active{background:#BDD7EE}
.num-btn.del{font-size:14px;color:#888}
.num-btn.enter{background:#1F3864;color:#fff;font-size:13px}
.num-btn.enter:active{background:#2E74B5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🔒</div>
  <h1>Acceso requerido</h1>
  <p class="sub">Ingresa el PIN para ver la ficha del activo</p>
  <div class="activo-id">{{ id }}</div>

  <form method="POST" id="pin-form">
    <div class="pin-label">PIN de acceso</div>
    <input type="password" name="pin" id="pin-display" class="pin-input"
           maxlength="6" placeholder="••••" readonly>
    <input type="hidden" name="pin" id="pin-hidden">

    {% if error %}
    <div class="error">❌ {{ error }}</div>
    {% endif %}

    <!-- Teclado numerico -->
    <div class="numpad">
      {% for n in ['1','2','3','4','5','6','7','8','9'] %}
      <button type="button" class="num-btn" onclick="addDigit('{{ n }}')">{{ n }}</button>
      {% endfor %}
      <button type="button" class="num-btn del" onclick="delDigit()">⌫</button>
      <button type="button" class="num-btn" onclick="addDigit('0')">0</button>
      <button type="button" class="num-btn enter" onclick="submitPin()">OK ✓</button>
    </div>
  </form>

  <div class="hint">Sistema de Activos Fijos — Colegio</div>
</div>

<script>
let pin = '';
function addDigit(d){
  if(pin.length >= 6) return;
  pin += d;
  document.getElementById('pin-display').value = '•'.repeat(pin.length);
  document.getElementById('pin-hidden').value = pin;
  if(pin.length >= 4) setTimeout(submitPin, 300);
}
function delDigit(){
  pin = pin.slice(0,-1);
  document.getElementById('pin-display').value = '•'.repeat(pin.length);
  document.getElementById('pin-hidden').value = pin;
}
function submitPin(){
  if(pin.length < 4) return;
  // Usar solo el input hidden con el valor real
  const form = document.getElementById('pin-form');
  // Remove the readonly display input from submission
  document.getElementById('pin-display').removeAttribute('name');
  form.submit();
}
// Soporte teclado fisico
document.addEventListener('keydown', e=>{
  if(e.key>='0' && e.key<='9') addDigit(e.key);
  else if(e.key==='Backspace') delDigit();
  else if(e.key==='Enter') submitPin();
});
</script>
</body>
</html>
